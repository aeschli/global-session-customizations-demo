			{ id: 'sessions.chatTimeline.display', label: 'Prompt timeline', description: 'Choose how to navigate prompts alongside the conversation.', group: 'Window and layout', preview: 'timeline', kind: 'choice', defaultValue: 'gutter', options: ['gutter', 'ruler', 'off'] },

			}
		}
		function Icon({ kind }: { readonly kind: 'computer' | 'session' | 'item' | 'settings' | 'copilot' | 'chevron' | 'check' }): React.ReactElement {
			return <svg className="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
				{kind === 'computer' ? <path d="M2 2.5h12v8H2zM5 13.5h6M8 10.5v3" />
					: kind === 'chevron' ? <path d="M4.5 6.5 8 10l3.5-3.5" />
					: kind === 'check' ? <path d="m3.5 8.5 3 3 6-7" />
					: kind === 'settings' ? <><path d="M2 4h12M2 8h12M2 12h12" /><path d="M5 2v4M11 6v4M6 10v4" strokeWidth="3" /></>
					: kind === 'session' ? <path d="M2.5 2.5h11v8h-7l-4 3z" />
					: kind === 'copilot' ? <><path d="M5.3 2.5a2.8 2.8 0 0 0-2.8 2.8v5.4a2.8 2.8 0 0 0 5.4 1h.2a2.8 2.8 0 0 0 5.4-1V5.3a2.8 2.8 0 0 0-5.4-1h-.2a2.8 2.8 0 0 0-2.6-1.8Z" /><path d="M5.2 6.2v.2m5.6-.2v.2M6.6 9.7c.8.6 2 .6 2.8 0" strokeWidth="1.5" /></>
					: <path d="M3 2.5h10v11H3zM5.5 6h5M5.5 9h5" />}
			</svg>;
		}
		function SettingPreview({ setting, value }: { readonly setting: Setting; readonly value: string | boolean }): React.ReactElement {
			const lines = (wrapped: boolean) => <div className="mini-lines">
				<div className="mini-line short" /><div className="mini-line accent" />
				{wrapped && <div className="mini-line indent" />}<div className="mini-line" /><div className="mini-line short" />
			</div>;
			return <div className="setting-preview" aria-hidden="true"><div className="mini-window">
				{setting.preview === 'timeline' ? <>
					<div className="mini-header">Conversation</div>
					<div className="mini-body">
						{value === 'gutter' && <div className="mini-rail" />}
						{lines(false)}
						{value === 'ruler' && <div className="mini-rail ruler" />}
					</div>
				</> : setting.preview === 'drafts' ? <>
					<div className="mini-header">Sessions</div>
					{value ? <div className="mini-draft">Drafts &nbsp; · &nbsp; New session</div> : <div className="mini-hint">Unsent sessions aren't saved</div>}
				</> : setting.preview === 'changes' ? <>
					<div className="mini-header">{value ? 'Single file · app.ts' : 'Changes · 2 files'}</div>
					{value ? <div className="mini-body">{lines(false)}<div className="mini-divider" />{lines(false)}</div>
						: <><div className="mini-file">app.ts<div className="mini-line accent" /></div><div className="mini-file">styles.css<div className="mini-line accent" /></div></>}
				</> : setting.preview === 'position' ? <>
					<div className="mini-header">Desktop side panel</div>
					<div className="mini-layout" data-position={String(value)}>
						<div className="mini-layout-editor">Editor<div className="mini-line accent" /><div className="mini-line short" /></div>
						<div className="mini-layout-details">Details</div>
					</div>
				</> : <>
					<div className="mini-header">{setting.preview === 'diff' ? 'Diff editor' : 'Editor'} · {value === 'inherit' ? 'Follow editor setting' : value === 'on' ? 'Wrap on' : 'Wrap off'}</div>
					<div className="mini-body">{lines(value === 'on')}{setting.preview === 'diff' && <><div className="mini-divider" />{lines(value === 'on')}</>}</div>
				</>}
			</div></div>;
		}
		const App = viewWithModel(PrototypeModel, (reader, model) => {
			const section = model.section.read(reader);
			const session = model.session.read(reader);
			const isGlobal = model.isGlobal.read(reader);
			const query = model.query.read(reader);
			const host = model.host.read(reader);
			const browseAgent = isAgent(section) && model.browsing.read(reader) ? section : undefined;
			const installed = model.installed.read(reader);
			const items = browseAgent ? catalog[browseAgent].filter(item => matchesItem(item, query)) : model.items.read(reader);
			const showActionColumn = !!browseAgent || isAgent(section) || section === 'Remotes' || items.some(item => item.enabled !== undefined);
			const visibleSyncedGroups = model.visibleSyncedGroups.read(reader);
			const visibleSettings = model.visibleSettings.read(reader);
			const pickerOpen = model.pickerOpen.read(reader);
			const pickerItems = model.pickerItems.read(reader);
			const pickerActive = model.pickerActive.read(reader);
			const sessionSectionVisible = model.sessionSectionVisible.read(reader);
			const demoMenuPosition = model.demoMenuPosition.read(reader);
			const openDemoMenuFrom = (button: HTMLButtonElement) => {
				const bounds = button.getBoundingClientRect();
				model.openDemoMenu({ x: bounds.right - 240, y: bounds.bottom + 4, focusTarget: button });
			};
			const demoOptionsTrigger = (from: HTMLElement) =>
				from.closest('.app-root')?.querySelector<HTMLButtonElement>('.demo-options-trigger') ?? undefined;
			const closeDemoMenu = (from: HTMLElement) => {
				const trigger = demoOptionsTrigger(from);
				const previousFocus = demoMenuPosition?.focusTarget;
				model.closeDemoMenu();
				(previousFocus?.isConnected ? previousFocus : trigger)?.focus();
			};
			const isSidebarMenuTarget = (target: EventTarget) => !(target instanceof Element && target.closest('button'));
			const onSidebarContextMenu = (event: React.MouseEvent<HTMLElement>) => {
				if (!isSidebarMenuTarget(event.target)) { return; }
				event.preventDefault();
				const activeElement = event.currentTarget.ownerDocument.activeElement;
				const focusTarget = activeElement instanceof HTMLElement && activeElement !== event.currentTarget.ownerDocument.body && !activeElement.closest('.demo-menu')
					? activeElement : demoOptionsTrigger(event.currentTarget);
				model.openDemoMenu({ x: event.clientX, y: event.clientY, focusTarget });
			};
			const closePicker = (from: HTMLElement) => {
				const trigger = from.closest('.window')?.querySelector<HTMLButtonElement>('.session-trigger');
				model.closePicker();
				trigger?.focus();
			};
			const onPickerKeyDown = (event: React.KeyboardEvent<HTMLInputElement>) => {
				const target = event.currentTarget;
				if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
					event.preventDefault();
					model.movePickerActive(event.key === 'ArrowDown' ? 1 : -1);
				} else if (event.key === 'Enter') {
					event.preventDefault();
					if (pickerItems.length) { closePicker(target); model.acceptPicker(); }
				} else if (event.key === 'Escape') {
					event.preventDefault();
					closePicker(target);
				}
			};
			const quickPick = pickerOpen && <>
				<div className="quick-pick-backdrop" onMouseDown={(event: React.MouseEvent<HTMLDivElement>) => closePicker(event.currentTarget)} />
				<div className="quick-pick" role="dialog" aria-label="Select session">
					<input type="text" autoFocus role="combobox" aria-expanded="true" aria-controls="session-quick-pick-list" aria-autocomplete="list"
						aria-activedescendant={pickerItems[pickerActive] ? `session-option-${pickerItems[pickerActive].id}` : undefined}
						aria-label="Select a session" placeholder="Select a session"
						value={model.pickerQuery.read(reader)}
						onChange={(event: React.ChangeEvent<HTMLInputElement>) => model.setPickerQuery(event.target.value)}
						onKeyDown={onPickerKeyDown} />
					<ul id="session-quick-pick-list" role="listbox" aria-label="Sessions">
						{pickerItems.map((s, index) => <li key={s.id} id={`session-option-${s.id}`} role="option" aria-selected={index === pickerActive}
							className={index === pickerActive ? 'active' : undefined}
							onMouseDown={(event: React.MouseEvent<HTMLLIElement>) => event.preventDefault()}
							onClick={(event: React.MouseEvent<HTMLLIElement>) => { closePicker(event.currentTarget); model.acceptPicker(index); }}>
							<Icon kind="session" />
							<span className="quick-pick-label">{s.name}</span>
							<span className="quick-pick-description">{sessionLabel(s)}</span>
							{s.id === session?.id && <Icon kind="check" />}
						</li>)}
						{pickerItems.length === 0 && <li className="quick-pick-empty" role="presentation">No matching sessions</li>}
					</ul>
				</div>
			</>;
			const settingValues = model.settingValues.read(reader);
			const renderSettingControl = (setting: Setting, value: string | boolean) => setting.kind === 'boolean' ? <>
				<span>{value === true ? 'On' : 'Off'}</span>
				<button className="switch" role="switch" aria-label={setting.label} aria-checked={value === true}
					onClick={() => model.setSetting(setting, value !== true)}><span /></button>
			</> : <label>Display
				<select aria-label={setting.label} value={String(value)}
					onChange={(event: React.ChangeEvent<HTMLSelectElement>) => model.setSetting(setting, event.target.value)}>
					{setting.options.map(option => <option key={option} value={option}>{option.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase())}</option>)}
				</select>
			</label>;
			const renderNav = (name: Section) => <button key={name} className="nav-item"
				aria-current={section === name ? 'page' : undefined}
				disabled={!globalSections.includes(name as GlobalSection) && !session}
				onClick={() => model.selectSection(name)}>
				<Icon kind={name === 'Settings' ? 'settings' : name === 'Remotes' ? 'computer' : name === 'Copilot' ? 'copilot' : 'item'} />
				<span className="nav-label">{name}</span>
				{!isAgent(name) && name !== 'Synced' && <span className="count">{itemsFor(name, session).length || ''}</span>}
			</button>;
			return <main className="app-root" onPointerDownCapture={(event: React.PointerEvent<HTMLElement>) => {
				if (demoMenuPosition && event.target instanceof Node
					&& !event.currentTarget.querySelector('.demo-menu')?.contains(event.target)
					&& !event.currentTarget.querySelector('.demo-options-trigger')?.contains(event.target)) {
					model.closeDemoMenu();
				}
			}}>
				<div className="preview-bar"><strong>Design prototype</strong><span className="muted">Global setup, with an explicit session context.</span>
					<button type="button" className="demo-options-trigger" aria-haspopup="menu" aria-expanded={!!demoMenuPosition}
						onClick={(event: React.MouseEvent<HTMLButtonElement>) => demoMenuPosition ? closeDemoMenu(event.currentTarget) : openDemoMenuFrom(event.currentTarget)}
						onKeyDown={(event: React.KeyboardEvent<HTMLButtonElement>) => {
							if (event.key === 'ArrowDown') { event.preventDefault(); openDemoMenuFrom(event.currentTarget); }
						}}>Demo Options <Icon kind="chevron" /></button>
				</div>
				<section className="window" aria-label="Customizations prototype">
					<header className="titlebar"><strong>Customizations</strong><span className="muted">Interactive mockup</span></header>
					<div className="body">
						<aside className="sidebar" aria-label="Customization navigation" onContextMenu={onSidebarContextMenu}
							onMouseDown={(event: React.MouseEvent<HTMLElement>) => {
								if (event.button === 2 && isSidebarMenuTarget(event.target)) {
									// Keep the previous focus available when the menu closes.
									event.preventDefault();
								}
							}}>
							<nav aria-label="Global">
								<h2 className="group-title">Global</h2>
								{renderNav('Settings')}
								{renderNav('Remotes')}
								{renderNav('VS Code Extensions')}
								<div className="global-customizations" role="group" aria-label="Customizations">
									<h3 className="group-title">Customizations</h3>
									{agents.map(renderNav)}
									{renderNav('Synced')}
								</div>
							</nav>
							{sessionSectionVisible && <section className="session-group" aria-labelledby="session-heading">
								<h2 className="group-title" id="session-heading">Session customization</h2>
								<button type="button" className="session-trigger" aria-haspopup="listbox" aria-expanded={pickerOpen}
									title={session ? session.name : undefined}
									aria-label={session ? `Session: ${session.name}, ${sessionLabel(session)}. Change session` : 'Select a session'}
									onClick={() => model.openPicker()}>
									<span className="session-trigger-label">{session ? sessionLabel(session) : 'Select a session'}</span>
									<Icon kind="chevron" />
								</button>
								<nav aria-label="Selected session customizations">{sessionSections.map(renderNav)}</nav>
							</section>}
						</aside>
						<div className="content">
							{!isGlobal && <div className="context"><Icon kind="session" /><div>
								<strong>{session?.name ?? 'No session selected'}</strong>
								<p>{session ? sessionLabel(session) : 'Choose a session in the sidebar to inspect its customizations.'}</p>
							</div></div>}
							<div className="page">
								<div className="page-heading"><div><h1 className={section === 'Copilot' ? 'agent-heading' : undefined}>{section === 'Copilot' && <Icon kind="copilot" />}{browseAgent ? `Browse ${browseAgent} customizations` : section}</h1><p className="description">{browseAgent ? `Try installing a sample customization for ${browseAgent} on ${host.name}.` : descriptions[section]}</p></div>
									{(isGlobal || session) && <input type="search" aria-label={browseAgent ? 'Search catalog' : `Search ${section}`} placeholder="Type to search..." value={query} onChange={(event: React.ChangeEvent<HTMLInputElement>) => model.setQuery(event.target.value)} />}
								</div>
								{isAgent(section) && <div className="host-toolbar">
									<div className="host-picker">
										<select aria-label="Agent host" value={host.id} onChange={(event: React.ChangeEvent<HTMLSelectElement>) => model.selectHost(event.target.value)}>
											{agentHosts.map(option => <option key={option.id} value={option.id}>{option.name}</option>)}
										</select>
									</div>
									<button className="quiet-button" onClick={() => model.toggleBrowse()}>{browseAgent ? 'Back to Installed' : 'Browse'}</button>
								</div>}
								{section === 'Settings' ? <>
									<p className="settings-intro muted">Explore how each choice changes your experience.</p>
									{visibleSettings.length === 0 ? <div className="empty">No matching settings.</div> : <>
									<div className="settings-grid">
										{visibleSettings.filter(setting => setting.preview).map(setting => {
											const value = settingValues.get(setting.id) ?? setting.defaultValue;
											return <article className="setting" key={setting.id}>
												<h2>{setting.label}</h2>
												<p className="setting-description">{setting.description}</p>
												<SettingPreview setting={setting} value={value} />
												<div className="setting-controls">{renderSettingControl(setting, value)}</div>
												<code className="setting-key">{setting.id}</code>
											</article>;
										})}
									</div>
									{settingsGroups.map(group => {
										const groupSettings = visibleSettings.filter(setting => !setting.preview && setting.group === group);
										return groupSettings.length > 0 && <section key={group} aria-label={group}>
											<h2 className="settings-group-title">{group}</h2>
											{groupSettings.map(setting => <article className="setting-row" key={setting.id}>
												<div className="setting-row-copy"><h3>{setting.label}</h3><p>{setting.description}</p><code className="setting-key">{setting.id}</code></div>
												<div className="setting-controls">{renderSettingControl(setting, settingValues.get(setting.id) ?? setting.defaultValue)}</div>
											</article>)}
										</section>;
									})}
									</>}
									<p className="scope-note">Example values only. Changes stay in this preview and do not modify real settings.</p>
								</> : section === 'Synced' ? <>
									<p className="muted">Preview data only; this does not read your installed extensions, built-in skills, or settings.</p>
									{visibleSyncedGroups.length === 0 ? <div className="empty">No matching sources.</div> : visibleSyncedGroups.map(group =>
										<section className="synced-group" key={group.name} aria-label={group.name}>
											<h2>{group.name}</h2><p>{group.description}</p>
											<table><thead><tr><th>Name</th><th>{group.column}</th>{group.items.some(item => item.enabled !== undefined) && <th className="item-action">Enabled</th>}</tr></thead>
												<tbody>{group.items.map(item => <tr key={item.name}><td>{item.name}<small>{item.description}</small></td><td>{item.source}</td>
													{item.enabled !== undefined && <td className="item-action"><button className="switch" role="switch" aria-label={`${item.name}: VS Code built-in skill`} aria-checked={item.enabled} onClick={() => model.toggle(item)}><span /></button></td>}
												</tr>)}</tbody>
											</table>
										</section>
									)}
								</> : !isGlobal && !session ? <div className="empty"><h1>Select a session</h1><p>Customizations depend on the session's project, agent and computer.</p><p>Global setup is always available above.</p></div>
									: items.length === 0 ? <div className="empty">{query.trim() ? 'No matching customizations.'
										: isAgent(section) ? `No ${section} customizations on ${host.name} yet. Use Browse to find something to install.`
											: `No ${section.toLowerCase()} available for this session.`}</div>
									: <table><thead><tr><th>Name</th><th>{isAgent(section) || !isGlobal ? 'Type' : 'Source'}</th>
										{showActionColumn && <th className="item-action">{browseAgent ? 'Action' : section === 'Remotes' ? 'Details' : 'Enabled'}</th>}</tr></thead>
										<tbody>{items.map(item => {
											const isInstalled = browseAgent !== undefined && installed.has(`${browseAgent}/${host.id}/${item.name}`);
											const isNotApplicable = !browseAgent && section !== 'Remotes' && item.enabled === undefined;
											return <tr key={item.name}><td>{item.name}<small>{item.description}{!isGlobal && item.source ? ` · ${item.source}` : ''}</small></td><td>{item.type ?? item.source}</td>
											{showActionColumn && <td className="item-action" aria-label={isNotApplicable ? 'Not applicable' : undefined}>{browseAgent ? (
												<button className="install-button" aria-disabled={isInstalled} aria-label={`${isInstalled ? 'Installed' : 'Install'} ${item.name}`}
													onClick={() => model.installPreview(browseAgent, host, item)}>{isInstalled ? 'Installed' : 'Install'}</button>
											) : section === 'Remotes' ? <span className="muted">{item.description}</span>
												: item.enabled === undefined ? <span className="muted" aria-hidden="true">—</span>
												: <button className="switch" role="switch" aria-label={`${item.name}: ${isAgent(section) ? `${section} on ${host.name}` : isGlobal ? 'global' : session?.name}`} aria-checked={item.enabled} onClick={() => model.toggle(item)}><span /></button>}</td>}</tr>;
										})}</tbody></table>}
								{!isGlobal && session && <p className="scope-note">Showing what is available to this session. Items can come from user, workspace, plugin or built-in sources.</p>}
							</div>
							<footer className="footer"><span role="status">{model.message.read(reader) || 'Prototype only. Changes stay in this preview and do not modify real settings.'}</span></footer>
						</div>
					</div>
					{quickPick}
				</section>
				{demoMenuPosition && <div className="demo-menu" role="menu" aria-label="Demo options"
					style={{
						left: `clamp(8px, ${demoMenuPosition.x}px, max(8px, calc(100vw - 248px)))`,
						top: `clamp(8px, ${demoMenuPosition.y}px, max(8px, calc(100vh - 64px)))`,
					}}
					onBlur={(event: React.FocusEvent<HTMLDivElement>) => {
						if (!event.currentTarget.contains(event.relatedTarget) && !event.relatedTarget?.closest('.demo-options-trigger')) {
							model.closeDemoMenu();
						}
					}}
					onKeyDown={(event: React.KeyboardEvent<HTMLDivElement>) => {
						if (event.key === 'Escape') { event.preventDefault(); closeDemoMenu(event.currentTarget); }
					}}>
					<button type="button" className="demo-menu-item" role="menuitemcheckbox" aria-checked={sessionSectionVisible} autoFocus
						onClick={(event: React.MouseEvent<HTMLButtonElement>) => {
							const trigger = demoOptionsTrigger(event.currentTarget);
							const previousFocus = demoMenuPosition.focusTarget;
							const focusWillBeHidden = sessionSectionVisible && previousFocus?.closest('.session-group');
							model.toggleSessionSection();
							(previousFocus?.isConnected && !focusWillBeHidden ? previousFocus : trigger)?.focus();
						}}>
						<span className="demo-menu-check" aria-hidden="true">{sessionSectionVisible && <Icon kind="check" />}</span>
						Session Customization
					</button>
				</div>}
			</main>;
		});
		const rootElement = document.getElementById('root');
		if (!rootElement) { throw new Error('Missing app root'); }
		if (globalThis.VSCODE_APP_ENV !== 'prod' && globalThis.vscodeAppAdapter?.enableComponentExplorer()) {
			const { defineFixture, defineFixtureGroup, defineFixtureVariants } = await import('https://esm.sh/@vscode/component-explorer@0.2.1-100?target=es2022');
			const { ExplorerApp } = await import('https://esm.sh/@vscode/component-explorer@0.2.1-100/viewer?target=es2022');
			const styles = document.getElementById('prototype-styles')?.textContent ?? '';
			function fixture(theme: 'dark' | 'light', session: string, section: Section, agentHost: AgentHost = agentHosts[0], browse = false, sessionSectionVisible = true) {
				return defineFixture({
					render: container => {
						const host = document.createElement('div');
						host.className = `vscode-theme default-${theme}-plus`;
						host.style.width = '1220px';
						host.style.height = '880px';
						const style = document.createElement('style');
						style.textContent = styles;
						host.append(style);
						const target = document.createElement('div');
						host.append(target);
						container.append(host);
						const root = createRoot(target);
						root.render(<App initialSession={session} initialSection={section} initialHost={agentHost} initialBrowse={browse} initialSessionSectionVisible={sessionSectionVisible} />);
						return { dispose: () => { root.unmount(); host.remove(); } };
					},
				});
			}
			new ExplorerApp(rootElement, {
				loadFixtures: async () => ({ 'fixtures/Customizations.fixture.tsx': { default: defineFixtureGroup({
					Initial: fixture('light', 'dialog', 'Settings', agentHosts[0], false, false),
					Session: defineFixtureVariants({ Light: fixture('light', 'dialog', 'Plugins'), Dark: fixture('dark', 'dialog', 'Plugins') }),
					Global: defineFixtureVariants({ Light: fixture('light', 'dialog', 'Remotes'), Dark: fixture('dark', 'dialog', 'Remotes') }),
					AgentHost: defineFixtureVariants({ Light: fixture('light', 'dialog', 'Copilot', agentHosts[1]), Dark: fixture('dark', 'dialog', 'Copilot', agentHosts[1]) }),
					CustomizationTypes: defineFixtureVariants({ Light: fixture('light', 'dialog', 'Copilot'), Dark: fixture('dark', 'dialog', 'Copilot') }),
					Browse: fixture('light', 'dialog', 'Claude', agentHosts[2], true),
					Synced: fixture('dark', 'dialog', 'Synced'),
					Settings: defineFixtureVariants({ Light: fixture('light', 'dialog', 'Settings'), Dark: fixture('dark', 'dialog', 'Settings') }),
					NoSession: fixture('light', '', 'Plugins'),
					Empty: fixture('light', 'remote', 'Canvases'),
				}) } }),
			});
		} else {
			if (window.parent === window && globalThis.vscodeAppAdapter) {
				// The standalone adapter otherwise starts with the OS theme.
				let theme: 'light' | 'dark' = 'light';
				const applyTheme = () => {
					document.documentElement.classList.remove('default-light-plus', 'default-dark-plus');
					document.documentElement.classList.add('vscode-theme', `default-${theme}-plus`);
					document.documentElement.style.colorScheme = theme;
				};
				applyTheme();
				globalThis.vscodeAppAdapter.addToolbarItem({
					id: 'theme',
					order: 100,
					label: () => theme === 'light' ? '☾ Dark' : '☀ Light',
					title: 'Toggle light / dark theme (drag the bar to move)',
					onClick: () => {
						theme = theme === 'light' ? 'dark' : 'light';
						applyTheme();
					},
				});
			}
			createRoot(rootElement).render(<App initialSession="dialog" initialSection="Settings" initialHost={agentHosts[0]} initialBrowse={false} initialSessionSectionVisible={false} />);
		}
	</script>
	<script data-vscode-app-unbundled src="https://unpkg.com/@vscode/web-editors@0.0.2-0/standalone-app-adapter.js"></script>
</body>
</html>
